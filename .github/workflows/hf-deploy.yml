name: Deploy to HuggingFace Space

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Git LFS
      run: |
        sudo apt-get update
        sudo apt-get install -y git-lfs
        git lfs install

    - name: Configure Git
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "github-actions"

    # 👇 This is the updated step to fix the authentication issue 👇
    - name: Push to HuggingFace Space
      env:
        # The HF_TOKEN secret is made available as an environment variable
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        set -e
        # PUSH DIRECTLY: Use the format https://USER:${HF_TOKEN}@host/repo
        # This explicitly provides the token as the password for HTTP basic authentication.
        # Make sure 'AhmadYarAI' is your correct Hugging Face username.
        git push https://AhmadYarAI:${HF_TOKEN}@huggingface.co/spaces/AhmadYarAI/famfin-api HEAD:main --force
