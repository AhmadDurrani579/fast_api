name: Deploy to HuggingFace Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Configure Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "🔐 Configuring HuggingFace remote..."
          git remote remove space 2>/dev/null || true
          git remote add space https://$HF_TOKEN@huggingface.co/spaces/AhmadYarAl/famfin-api

          echo "🚀 Pushing latest changes to HuggingFace..."
          git push space HEAD:main --force
